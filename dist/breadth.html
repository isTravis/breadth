<style>
/* Layout: full-bleed canvas. Each view fills the screen on its own deep color; a thin floating top bar (wordmark + views)
   and a floating bottom bar (caption + view controls + highlight). Deliberately single-look (always dark). */
:root {
  color-scheme: dark;
  --canvas: #10243a;
  --fg: #f3eee4;
  --fg-2: rgba(243, 238, 228, 0.62);
  --line: rgba(243, 238, 228, 0.16);
  --glass: rgba(255, 255, 255, 0.07);
  --glass-2: rgba(255, 255, 255, 0.14);
  --accent: #ffd27a;      /* butter */
  --mark: #ff7a6b;        /* night warning */
  --night: rgba(0, 0, 0, 0.28);

  --f-flour: #eadcb8; --f-grain: #c08d69; --f-gf: #dcc15e; --f-starter: #63bb92;
  --f-liquid: #72a9d8; --f-dairy: #b4d8e0; --f-egg: #f09c66; --f-fat: #f0d066;
  --f-sweet: #e26d5f; --f-salt: #b3b5be; --f-seed: #a99581; --f-flavor: #e19abd;
  --f-leaven: #a3a8dc; --f-binder: #9ab862;

  --p-levain: #63bb92; --p-mix: #f3eee4; --p-bulk: #e2ae4a; --p-proof: #eed291; --p-cold: #8cc2ea;
  --p-wait: #7f889a; --p-shape: #f3eee4; --p-bake: #f07f50; --p-cool: #7f889a;

  --wide: "Unbounded", "Avenir Next", "Segoe UI", sans-serif;
  --body: "Manrope", "Avenir Next", "Segoe UI", sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
  --gx: max(18px, env(safe-area-inset-left, 0px));
  --gr: max(18px, env(safe-area-inset-right, 0px));
}
body[data-view="portraits"] { --canvas: #10243a; }
body[data-view="map"] { --canvas: #1b1d42; }
body[data-view="web"] { --canvas: #26162f; }
body[data-view="schedule"] { --canvas: #0a1529; }
body[data-view="lineage"] { --canvas: #10291f; }

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { min-height: 100%; }
body {
  margin: 0; background: var(--canvas); color: var(--fg); font-family: var(--body); font-size: 14px; line-height: 1.5;
  transition: background-color 0.6s ease; overflow-x: hidden;
}
a { color: var(--accent); }
button, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* header: row 1 = wordmark + views; row 2 = what this view shows + its controls */
.topbar { position: fixed; left: 0; right: 0; top: 0; z-index: 10; padding: calc(14px + env(safe-area-inset-top, 0px)) var(--gr) 16px var(--gx);
  display: grid; gap: 12px; background: linear-gradient(var(--canvas) 78%, transparent); transition: background 0.6s; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 11; background: var(--canvas); }
.row1, .row2 { display: flex; justify-content: space-between; gap: 12px 20px; }
.row1 { align-items: center; }
.row2 { align-items: flex-end; flex-wrap: wrap; }
.word { display: grid; gap: 1px; }
.word b { font-family: var(--wide); font-weight: 500; font-size: 22px; letter-spacing: 0.04em; line-height: 1; }
.word span { font-size: 11.5px; color: var(--fg-2); }
nav.views { display: flex; gap: 2px; background: var(--glass); border: 1px solid var(--line); border-radius: 12px; padding: 3px; }
nav.views a { display: flex; align-items: center; gap: 7px; padding: 6px 11px 6px 8px; border-radius: 9px; color: var(--fg-2); text-decoration: none; font-weight: 600; font-size: 13px; }
nav.views a:hover { color: var(--fg); }
nav.views a[aria-current="page"] { background: var(--fg); color: var(--canvas); }
nav.views svg { width: 20px; height: 20px; flex: none; }
nav.views svg * { stroke: currentColor; fill: none; stroke-width: 1.5; }
@media (max-width: 980px) { nav.views a span { display: none; } nav.views a { padding: 6px 7px; } }

.caption { flex: 1 1 460px; min-width: 0; max-width: 88ch; display: grid; gap: 3px; }
.caption h2 { margin: 0; font-family: var(--wide); font-weight: 400; font-size: clamp(20px, 2.2vw, 28px); letter-spacing: 0.01em; line-height: 1.1; }
.caption p { margin: 0; color: var(--fg-2); font-size: 13px; line-height: 1.45; }
@media (max-width: 700px) {
  .caption p { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; cursor: pointer; }
  .caption p.open { -webkit-line-clamp: unset; }
}
.icon-btn { border: 0; background: none; color: var(--fg-2); cursor: pointer; font-size: 12px; padding: 2px 4px; }
.icon-btn:hover { color: var(--fg); }

.dock { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: flex-end; }
.group { display: inline-flex; align-items: center; gap: 2px; background: var(--glass); border: 1px solid var(--line); border-radius: 12px; padding: 3px; }
.group > span { font-family: var(--mono); font-size: 10px; color: var(--fg-2); text-transform: uppercase; letter-spacing: 0.08em; padding: 0 6px 0 8px; }
.group button { border: 0; background: none; padding: 5px 10px; border-radius: 9px; cursor: pointer; font-size: 12.5px; font-weight: 600; color: var(--fg-2); }
.group button:hover { color: var(--fg); }
.group button[aria-pressed="true"] { background: var(--fg); color: var(--canvas); }
.group select { background: transparent; border: 0; padding: 4px 6px; font-size: 12.5px; font-weight: 600; }
.group select option { background: #1b1d2a; }
.hl { position: relative; }
.pop { position: absolute; right: 0; top: calc(100% + 8px); width: 220px; background: #161b28; border: 1px solid var(--line); border-radius: 12px; padding: 8px; display: grid; gap: 1px; box-shadow: 0 18px 40px rgba(0,0,0,0.4); z-index: 12; }
.tag { display: grid; grid-template-columns: 12px minmax(0, 1fr) auto; gap: 9px; align-items: center; padding: 5px 8px; border: 0; background: none; text-align: left; cursor: pointer; border-radius: 7px; font-size: 13px; width: 100%; }
.tag:hover { background: var(--glass); }
.tag i { width: 10px; height: 10px; border-radius: 50%; border: 1.5px solid var(--fg-2); }
.tag[aria-pressed="true"] i { background: var(--accent); border-color: var(--accent); }
.tag span:last-child { font-family: var(--mono); font-size: 11px; color: var(--fg-2); }
.count-dot { display: inline-block; min-width: 18px; padding: 0 5px; margin-left: 6px; border-radius: 9px; background: var(--accent); color: #1a1a1a; font-size: 11px; text-align: center; }

/* views */
.view { padding: calc(var(--hdr, 150px) + 4px) var(--gr) calc(18px + env(safe-area-inset-bottom, 0px)) var(--gx); }
.view.fit { height: 100vh; height: 100dvh; display: flex; flex-direction: column; gap: 10px; }
.stage { flex: 1; min-height: 0; position: relative; }
.stage svg { display: block; }
svg text { fill: var(--fg); font-family: var(--body); }
svg .muted { fill: var(--fg-2); }
svg .mono { font-family: var(--mono); }
.out { opacity: 0.12 !important; }
[data-rid] { transition: opacity 0.25s; }
.ring { stroke: var(--canvas); stroke-width: 1; transition: stroke 0.6s; }
.hole { fill: var(--canvas); transition: fill 0.6s; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 11.5px; color: var(--fg-2); }
.legend i { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 5px; vertical-align: -1px; }
.legend i.sq { border-radius: 2px; width: 14px; height: 8px; }

/* portraits */
.sheet { flex: 1; min-height: 0; display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); grid-template-rows: repeat(4, minmax(0, 1fr)); gap: 4px 10px; }
.frame { min-height: 0; display: flex; flex-direction: column; align-items: center; gap: 2px; cursor: pointer; text-align: center; border-radius: 12px; padding: 4px; view-transition-name: var(--vt); }
.frame svg { flex: 1; min-height: 0; width: 100%; overflow: visible; transition: transform 0.25s ease; }
.frame:hover svg, .frame:focus-visible svg { transform: scale(1.06); }
.frame h3 { margin: 0; font-size: 13px; font-weight: 700; line-height: 1.2; }
.frame .stats { font-family: var(--mono); font-size: 10px; color: var(--fg-2); }
@media (max-width: 980px) {
  .view.fit.flow { height: auto; }
  .sheet { grid-template-columns: repeat(3, minmax(0, 1fr)); grid-template-rows: none; gap: 14px 8px; }
  .frame svg { flex: none; height: 110px; }
}

/* map */
.axis line, .axis path { stroke: var(--line); }
.axis text { fill: var(--fg-2); font-family: var(--mono); font-size: 10.5px; }
.band-label { font-family: var(--mono); font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; fill: var(--fg-2); }
.near { fill: none; stroke: var(--fg); stroke-width: 1; opacity: 0.22; }
.near.on { opacity: 1; stroke: var(--accent); stroke-width: 1.6; }
.node { cursor: pointer; }
.node text { font-size: 12px; font-weight: 700; paint-order: stroke; stroke: var(--canvas); stroke-width: 4px; stroke-linejoin: round; }
.dim { opacity: 0.16; }

/* web */
.facts { position: absolute; left: 0; top: 0; width: 230px; display: grid; gap: 16px; font-size: 12.5px; }
.facts h4 { margin: 0 0 4px; font-family: var(--mono); font-size: 10px; text-transform: uppercase; letter-spacing: 0.09em; color: var(--fg-2); font-weight: 400; }
.facts ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 2px; }
.facts li { display: flex; justify-content: space-between; gap: 8px; }
.facts li span:last-child { font-family: var(--mono); color: var(--fg-2); font-size: 11px; text-align: right; }
@media (max-width: 1250px) { .facts { display: none; } }
.link { fill: none; stroke-width: 1.2; opacity: 0.38; transition: opacity 0.15s; }
.link.on { opacity: 1; stroke-width: 2; }
.link.off { opacity: 0.04; }
.inode, .rnode { cursor: pointer; }
.rnode text, .inode text { font-size: 11.5px; transition: opacity 0.15s; }
.inode text { font-size: 11px; fill: var(--fg-2); }

/* schedule */
.insight { margin: 0; font-family: var(--wide); font-weight: 400; font-size: clamp(14px, 1.5vw, 18px); line-height: 1.4; max-width: 80ch; letter-spacing: 0.01em; }
.insight b { font-weight: 500; color: var(--accent); }
.sched-wrap { flex: 1; min-height: 0; overflow: auto; position: relative; }
.lane .t { font-weight: 700; cursor: pointer; }
.lane .t:hover { fill: var(--accent); }
.lane .s { font-family: var(--mono); fill: var(--fg-2); }
.ph { cursor: pointer; }
.ph:hover { stroke: var(--fg); stroke-width: 1.5; }
.tip { position: absolute; pointer-events: none; background: #0c0f18; border: 1px solid var(--line); color: var(--fg); padding: 8px 10px; font-size: 12.5px; line-height: 1.35; width: max-content; max-width: 270px; border-radius: 10px; z-index: 3; }
.tip b { display: block; }
.tip span { font-family: var(--mono); font-size: 11px; color: var(--fg-2); display: block; }

/* lineage */
.eras { position: relative; display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 12px; }
.eras > svg { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; overflow: visible; }
.era { display: grid; align-content: start; gap: 10px; min-width: 0; position: relative; z-index: 1; }
.era-head { padding-bottom: 6px; border-bottom: 1px solid var(--line); }
.era-head b { font-family: var(--wide); font-weight: 500; font-size: 15px; display: block; letter-spacing: 0.02em; }
.era-head span { font-family: var(--mono); font-size: 10px; color: var(--fg-2); }
.card { background: color-mix(in srgb, var(--canvas), white 6%); border: 1px solid var(--line); border-radius: 12px; padding: 11px; display: grid; gap: 6px; cursor: pointer; min-width: 0; }
.card:hover { background: color-mix(in srgb, var(--canvas), white 11%); }
.card .row { display: flex; gap: 9px; align-items: center; }
.card svg { flex: none; width: 38px; height: 38px; overflow: visible; }
.card h3 { margin: 0; font-size: 13.5px; font-weight: 700; line-height: 1.15; }
.card .place { font-family: var(--mono); font-size: 9.5px; color: var(--accent); text-transform: uppercase; letter-spacing: 0.06em; }
.card p { margin: 0; font-size: 12.5px; color: var(--fg-2); line-height: 1.4; }
.card blockquote { margin: 0; font-size: 12.5px; line-height: 1.4; font-style: italic; color: var(--fg); padding-left: 9px; border-left: 2px solid var(--accent); }
.lineage-link { fill: none; stroke: var(--accent); stroke-width: 1.3; opacity: 0.45; }
.note { font-size: 12px; color: var(--fg-2); margin: 14px 0 0; }
@media (max-width: 1200px) { .eras { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
@media (max-width: 640px) { .eras { grid-template-columns: minmax(0, 1fr); } .eras > svg { display: none; } }

/* drawer */
.drawer {
  position: fixed; top: 0; right: 0; bottom: 0; width: min(450px, 100%); background: #10141e; border-left: 1px solid var(--line);
  z-index: 20; overflow-y: auto; transform: translateX(105%); transition: transform 0.28s ease; box-shadow: -30px 0 60px rgba(0,0,0,0.35);
  padding: calc(22px + env(safe-area-inset-top, 0px)) max(22px, env(safe-area-inset-right, 0px)) calc(28px + env(safe-area-inset-bottom, 0px)) 22px;
  display: grid; align-content: start; gap: 18px; --canvas: #10141e;
}
.drawer.open { transform: none; }
.drawer .close { justify-self: end; }
.drawer-top { display: grid; grid-template-columns: 100px minmax(0, 1fr); gap: 16px; align-items: center; }
.drawer-top svg { width: 100px; height: 100px; overflow: visible; }
.drawer h2 { font-family: var(--wide); font-weight: 500; font-size: 24px; line-height: 1.1; margin: 0; letter-spacing: 0.01em; }
.drawer .meta { font-family: var(--mono); font-size: 11px; color: var(--fg-2); margin-top: 6px; }
.drawer blockquote { margin: 0; font-size: 15px; line-height: 1.5; font-style: italic; padding-left: 12px; border-left: 2px solid var(--accent); }
table.formula { width: 100%; border-collapse: collapse; font-size: 13.5px; font-variant-numeric: tabular-nums; }
table.formula td { padding: 6px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
table.formula td.n { text-align: right; font-family: var(--mono); font-size: 12px; white-space: nowrap; padding-left: 10px; }
table.formula .stage { font-family: var(--mono); font-size: 9.5px; color: var(--fg-2); text-transform: uppercase; margin-left: 6px; }
table.formula .sub { display: block; font-size: 12px; color: var(--fg-2); }
.bar { height: 4px; display: block; margin-top: 5px; border-radius: 2px; }
.drawer h4 { margin: 0 0 8px; font-family: var(--mono); font-size: 10px; text-transform: uppercase; letter-spacing: 0.09em; color: var(--fg-2); font-weight: 400; }
.drawer .neighbors { display: flex; gap: 6px; flex-wrap: wrap; }
.drawer .neighbors button { border: 1px solid var(--line); background: var(--glass); border-radius: 9px; padding: 4px 10px; cursor: pointer; font-size: 13px; font-weight: 600; }
.mini { display: flex; height: 10px; width: 100%; border-radius: 3px; overflow: hidden; }
.mini span { display: block; height: 100%; border-right: 1px solid #10141e; }
.scrim { position: fixed; inset: 0; background: rgba(0,0,0,0.35); z-index: 19; }

@media (max-width: 700px) { .dock { justify-content: flex-start; } .group > span { display: none; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>

    link.classed("on", pred).classed("off", d => !pred(d));
    inode.select("text").style("opacity", d => keepI.has(d) ? 1 : 0);
    rnode.select("text").style("opacity", b => keepR.has(b.id) ? 1 : 0.2);
  };
  const clear = () => { link.classed("on", false).classed("off", false); inode.select("text").style("opacity", d => count.get(d) >= 3 ? 1 : 0); rnode.select("text").style("opacity", 1); };
  inode.on("mouseenter", (e, c) => { const r = new Set(edges.filter(d => d.c === c).map(d => d.id)); focus(d => d.c === c, new Set([c]), r); }).on("mouseleave", clear);
  rnode.on("mouseenter", (e, b) => { const i = new Set(edges.filter(d => d.id === b.id).map(d => d.c)); focus(d => d.id === b.id, i, new Set([b.id])); }).on("mouseleave", clear);
  const singles = ingr.filter(c => count.get(c) === 1);
  const recipeOf = c => B.find(b => b.ings.some(i => i.c === c)).title;
  const shared = ingr.filter(c => count.get(c) > 1).sort((a, c) => count.get(c) - count.get(a)).slice(0, 7);
  const unique = B.map(b => ({ b, n: [...new Set(b.ings.map(i => i.c))].filter(c => count.get(c) === 1).length })).filter(d => d.n).sort((a, c) => c.n - a.n).slice(0, 4);
  document.getElementById("facts").innerHTML = `
    <div><h4>Most shared, after the core four</h4><ul>${shared.map(c => `<li><span>${c}</span><span>${count.get(c)}</span></li>`).join("")}</ul></div>
    <div><h4>Used once in the collection</h4><ul>${singles.slice(0, 9).map(c => `<li><span>${c}</span><span>${esc(recipeOf(c))}</span></li>`).join("")}</ul></div>
    <div><h4>Most one-of-a-kind</h4><ul>${unique.map(d => `<li><span>${esc(d.b.title)}</span><span>${d.n} unique</span></li>`).join("")}</ul></div>`;
}

/* ---------- Bake schedule ---------- */
const sched = { day: 5, hour: 18, mode: "day" };
function drawSchedule() {
  const sel = document.getElementById("ready-hour");
  sel.innerHTML = d3.range(6, 23).map(h => `<option value="${h}" ${h === sched.hour ? "selected" : ""}>${h % 12 || 12}:00 ${h < 12 ? "am" : "pm"}</option>`).join("");
  sel.addEventListener("change", () => { sched.hour = +sel.value; renderSchedule(); applyHighlight(); });
  const seg = (id, key, attr, cast) => document.getElementById(id).addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b) return;
    sched[key] = cast(b.dataset[attr]);
    document.getElementById(id).querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", x === b ? "true" : "false"));
    renderSchedule(); applyHighlight();
  });
  seg("ready-day", "day", "d", Number); seg("plan", "mode", "p", String);
  document.getElementById("legend-s").innerHTML = Object.entries(PH).map(([k, l]) => `<span><i class="sq" style="background:var(--p-${k});opacity:${HANDS.has(k) ? 1 : 0.6}"></i>${l}</span>`).join("")
    + `<span><i class="sq" style="height:2px;background:var(--p-bake)"></i>Oven heating</span>`;
  renderSchedule();
}
function renderSchedule() {
  const wrap = document.getElementById("sched-wrap");
  const [VW, VH] = size(wrap);
  const ready = sched.day * 24 + sched.hour;
  const rows = B.map(b => ({ b, p: plan(b.id, sched.mode) }));
  rows.sort((a, c) => (c.p ? c.p.total : -1) - (a.p ? a.p.total : -1));
  const maxT = d3.max(rows, r => r.p ? r.p.total + r.p.preheat : 0);
  const top = 40;
  const RH = Math.max(22, Math.min(34, (VH - top - 6) / rows.length));
  const LW = 168;
  const t0 = Math.floor(ready - maxT - 6), t1 = ready + 1;
  const PX = Math.max(10, (VW - LW - 16) / (t1 - t0));
  const W = LW + (t1 - t0) * PX + 16, H = top + rows.length * RH + 6;
  const x = t => LW + (t - t0) * PX;
  const fs = Math.min(12.5, RH * 0.48);
  const svg = d3.select("#sched").attr("width", W).attr("height", H).attr("viewBox", `0 0 ${W} ${H}`);
  svg.selectAll("*").remove();
  for (let d = Math.floor(t0 / 24) - 1; d <= Math.ceil(t1 / 24); d++) {
    const a = Math.max(t0, d * 24 - 1), b = Math.min(t1, d * 24 + 7);
    if (b > a) {
      svg.append("rect").attr("x", x(a)).attr("y", 20).attr("width", (b - a) * PX).attr("height", H - 20).attr("fill", "var(--night)");
      if ((b - a) * PX > 40) svg.append("text").attr("class", "muted mono").attr("x", x(a) + 5).attr("y", 33).attr("font-size", 9).text("NIGHT");
    }
  }
  const ax = svg.append("g");
  for (let t = Math.ceil(t0); t <= t1; t++) {
    const hr = ((t % 24) + 24) % 24;
    if (hr === 0) {
      ax.append("line").attr("x1", x(t)).attr("x2", x(t)).attr("y1", 2).attr("y2", H).attr("stroke", "var(--line)");
      ax.append("text").attr("x", x(t) + 5).attr("y", 13).attr("font-size", 12).attr("font-weight", 700).text(DAYS[Math.floor(t / 24) % 7]);
    } else if (hr % 6 === 0 && Math.abs(t - ready) > 1.5) {
      ax.append("text").attr("class", "muted mono").attr("x", x(t)).attr("y", 13).attr("font-size", 9.5).attr("text-anchor", "middle").text(hr === 12 ? "noon" : `${hr % 12}${hr < 12 ? "am" : "pm"}`);
    }
  }
  svg.append("line").attr("x1", x(ready)).attr("x2", x(ready)).attr("y1", 18).attr("y2", H).attr("stroke", "var(--accent)").attr("stroke-width", 2);
  svg.append("text").attr("x", x(ready) - 6).attr("y", 13).attr("text-anchor", "end").attr("font-size", 12).attr("fill", "var(--accent)").attr("font-weight", 700).text("Ready");
  const tip = document.getElementById("tip");
  rows.forEach((r, i) => {
    const y = top + i * RH, bh = Math.max(10, RH * 0.5), by = y + (RH - bh) / 2 - 2;
    const g = svg.append("g").attr("class", "lane").attr("data-rid", r.b.id);
    clickable(g.append("text").attr("class", "t").attr("x", 0).attr("y", by + bh / 2).attr("dy", "0.35em").attr("font-size", fs).text(r.b.title), r.b.id);
    if (!r.p) { g.append("text").attr("class", "s").attr("x", x(ready) - 8).attr("y", by + bh / 2).attr("dy", "0.35em").attr("text-anchor", "end").attr("font-size", 10).text("no method steps yet"); return; }
    let t = ready - r.p.total;
    const start = t;
    g.append("text").attr("class", "s").attr("x", x(start) - 7).attr("y", by + bh / 2).attr("dy", "0.35em").attr("text-anchor", "end").attr("font-size", 10).text(clock(start));
    r.p.ph.forEach(ph => {
      const a = t, b = t + ph.h; t = b;
      if (ph.kind === "bake" && r.p.preheat) g.append("rect").attr("x", x(a - r.p.preheat)).attr("y", by - 4).attr("width", r.p.preheat * PX).attr("height", 2).attr("fill", "var(--p-bake)");
      g.append("rect").attr("class", "ph").attr("x", x(a)).attr("y", by).attr("width", Math.max(2, ph.h * PX - 1)).attr("height", bh).attr("rx", 2)
        .attr("fill", `var(--p-${ph.kind})`).attr("opacity", ph.hands ? 1 : 0.55)
        .on("mousemove", e => {
          const rb = wrap.getBoundingClientRect();
          tip.hidden = false;
          tip.innerHTML = `<b>${esc(r.b.title)}: ${esc(ph.label)}</b><span>${clock(a)} to ${clock(b)}</span><span>${dur(ph.h)}${ph.range ? ` · recipe says ${esc(ph.range)}` : ""}${ph.est ? " · our estimate" : ""}</span>`;
          let lx = e.clientX - rb.left + wrap.scrollLeft + 14; if (lx + 280 > wrap.scrollLeft + rb.width) lx -= 300;
          let ly = e.clientY - rb.top + wrap.scrollTop + 14; if (ly + 80 > wrap.scrollTop + rb.height) ly -= 100;
          tip.style.left = lx + "px"; tip.style.top = ly + "px";
        }).on("mouseleave", () => { tip.hidden = true; });
      if (ph.hands && atNight(a, b)) {
        const cx = x(a + ph.h / 2), w = Math.max(24, ph.h * PX + 16);
        g.append("ellipse").attr("cx", cx).attr("cy", by + bh / 2).attr("rx", w / 2).attr("ry", bh * 0.95).attr("fill", "none").attr("stroke", "var(--mark)").attr("stroke-width", 1.8).attr("pointer-events", "none");
      }
    });
  });
  const live = rows.filter(r => r.p);
  const longest = live[0], shortest = live[live.length - 1];
  const easiest = live.filter(r => r.p.total >= 12).sort((a, c) => a.p.hands - c.p.hands)[0];
  const nights = live.filter(r => { let t = ready - r.p.total; return r.p.ph.some(ph => { const a = t; t += ph.h; return ph.hands && atNight(a, t); }); }).length;
  document.getElementById("insight").innerHTML = `For ${clock(ready)}: ${esc(longest.b.title)} starts <b>${clock(ready - longest.p.total)}</b>, ${esc(shortest.b.title)} can wait until <b>${clock(ready - shortest.p.total)}</b>.`
    + (easiest ? ` Of the long ones, ${esc(easiest.b.title)} needs you least, ${dur(easiest.p.hands)} hands-on.` : "")
    + (nights ? ` <b>${nights}</b> ${nights === 1 ? "recipe has" : "recipes have"} you up at night.` : " Nothing needs you at night.");
}

/* ---------- Bread lineage ---------- */
const ERAS = [["Antiquity", "before 500"], ["Middle Ages", "500 to 1500"], ["Early modern", "1500 to 1800"], ["1800s", "industrial baking"], ["1900s", "city bakeries"], ["Since 2000", "home bakers"]];
const HIST = {
  "basic-white": [0, "Ancient Egypt onward", "Flour, water, salt, and a wild culture. Leavened bread of this kind goes back to ancient Egypt."],
  "whole-wheat": [0, "Everywhere", "Whole grain was the norm until roller mills made white flour cheap in the late 1800s."],
  "foccacia": [0, "Liguria, Italy", "From the Latin panis focacius, bread baked on the hearth. Liguria made the oily, dimpled version its own."],
  "pretzel": [1, "Southern Germany", "The knotted shape became the sign of German bakers. The lye bath gives the dark, glossy crust."],
  "gabes-fulkornbroyt": [1, "Eastern Europe", "Yiddish for whole-grain bread: the dense rye of the Ashkenazi kitchen. Gabe wrote it up as his own."],
  "pumpernickel-complex": [1, "Westphalia, Germany", "Rye baked low and slow, up to a day, in a closed tin. The long bake, not molasses, makes it dark."],
  "water-challah": [1, "Ashkenazi Europe", "The braided Sabbath loaf. Water challah leaves out the eggs."],
  "bagel": [2, "Kraków, Poland", "Named in Kraków's community rules of 1610. Jewish immigrants carried it to New York around 1900."],
  "scone": [2, "Scotland", "First recorded in Scotland in the early 1500s, as a griddled round cut into wedges."],
  "vg-shortbread": [2, "Scotland", "Butter is what made it short. This version swaps in coconut oil."],
  "pound-cake": [2, "England", "A pound each of flour, butter, sugar, and eggs. Gabe's uses olive oil, lemon, and starter."],
  "dinner-rolls": [3, "United States", "Soft American table rolls; Boston's Parker House made the folded kind famous in the 1870s."],
  "donut": [3, "New York", "Dutch olykoeks, oil cakes, came to New Amsterdam; the ring shape arrived in the mid-1800s."],
  "pizza-dough": [3, "Naples, Italy", "Neapolitan street food: a hearth flatbread with toppings."],
  "baguette": [4, "Paris, France", "The long, thin loaf became the everyday Paris bread in the early 1900s."],
  "rye-sandwich": [4, "New York", "Close kin to deli rye, the sandwich loaf of Jewish New York."],
  "wh-pizza-dough": [4, "A wetter dough", "Same family as the pizza dough, pushed to 80% water and shaped long."],
  "buckwheat-baguette-r-s": [5, "Modern blend", "A baguette shape carrying buckwheat, rye, and whole wheat."],
  "pumpernickel-simple": [5, "Shortcut", "The Westphalian loaf, simplified for a home oven."],
  "gluten-free-dan-bread": [5, "Gluten-free", "Psyllium lets a dough with no gluten hold its gas and its shape."],
  "gf-c-v-bread": [5, "Gluten-free", "Five flours and starches with psyllium and flax, at 128% water."],
  "gf-pizza-dough": [5, "Gluten-free", "Pizza built on a 1:1 gluten-free blend."],
  "crackers-for-discard": [5, "Zero waste", "Discard recipes spread with the home sourdough boom of 2020."],
  "ricotta-pancakes-discard": [5, "Zero waste", "Breakfast from the starter you would otherwise pour off."],
};
const LINEAGE = [["foccacia", "pizza-dough"], ["pizza-dough", "wh-pizza-dough"], ["wh-pizza-dough", "gf-pizza-dough"], ["basic-white", "baguette"], ["baguette", "buckwheat-baguette-r-s"],
  ["pumpernickel-complex", "pumpernickel-simple"], ["gabes-fulkornbroyt", "rye-sandwich"], ["basic-white", "gluten-free-dan-bread"], ["water-challah", "bagel"], ["scone", "vg-shortbread"]];
function drawLineage() {
  const box = document.getElementById("eras");
  box.innerHTML = `<svg aria-hidden="true"></svg>` + ERAS.map(([n, s], i) => `<div class="era" data-era="${i}"><div class="era-head"><b>${n}</b><span>${s}</span></div></div>`).join("");
  B.forEach(b => {
    const [era, place, note] = HIST[b.id];
    const q = b.headnotes[0];
    const el = document.createElement("div");
    el.className = "card"; el.dataset.rid = b.id;
    el.innerHTML = `<div class="row"><svg viewBox="-20 -20 40 40"></svg><div><div class="place">${esc(place)}</div><h3>${esc(b.title)}</h3></div></div>
      <p>${esc(note)}</p>${q ? `<blockquote>${esc(q.length > 150 ? q.slice(0, q.lastIndexOf(" ", 145)) + "…" : q)}</blockquote>` : ""}`;
    glyph(el.querySelector("svg"), b, 20);
    clickable(d3.select(el), b.id);
    box.querySelector(`[data-era="${era}"]`).appendChild(el);
  });
  requestAnimationFrame(linkLineage);
}
function linkLineage() {
  const box = document.getElementById("eras"), svg = box.querySelector("svg"); if (!svg) return;
  const o = box.getBoundingClientRect();
  const pos = id => { const r = box.querySelector(`.card[data-rid="${id}"] svg`).getBoundingClientRect(); return [r.left - o.left + r.width / 2, r.top - o.top + r.height / 2]; };
  svg.innerHTML = LINEAGE.map(([a, c]) => {
    const [x1, y1] = pos(a), [x2, y2] = pos(c);
    if (Math.abs(x2 - x1) < 20) { const bx = x1 - 30; return `<path class="lineage-link" d="M${x1},${y1}C${bx},${y1} ${bx},${y2} ${x2},${y2}"/>`; }
    const mx = (x1 + x2) / 2; return `<path class="lineage-link" d="M${x1},${y1}C${mx},${y1} ${mx},${y2} ${x2},${y2}"/>`;
  }).join("");
}

route();
document.fonts && document.fonts.ready.then(() => { setHdr(); if (RESIZE[current]) { RESIZE[current](); applyHighlight(); } });
</script>
